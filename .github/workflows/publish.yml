name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check the version before publishing
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if os.environ["GITHUB_REF_TYPE"] != "tag":
              raise SystemExit("PyPI publishing requires a version tag.")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag.removeprefix("v") != project["version"]:
              raise SystemExit(f"Tag {tag} does not match version {project['version']}.")
          print(f"Building {project['name']} {project['version']}")
          PY
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build source distribution and wheel with Poetry
        run: python -m build
      - name: Validate distribution metadata and README
        run: python -m twine check --strict dist/*
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install the built wheel and evolutionary dependencies
        shell: bash
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[evolutionary]"
          python -m pip check
      - name: Test the installed package outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Store validated distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/acds
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
